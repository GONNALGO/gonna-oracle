<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060a" />
    <!-- v6.2 PWA: installable = TRUE fullscreen on iPhone/Android home screen -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GONNA" />
    <title>GONNA FIGHT</title>
    <script>
      /* v9.0.1 hotfix: the wallet SDKs (WalletConnect/bowser inside the lazy
         Pera/Defly chunks) reference Node's `global`. Define it before any
         chunk can evaluate, exactly like the garage's esbuild --define:global=window. */
      window.global = window.global || window;
    </script>
    <style>
      /* v6 mobile hardening: no scroll, no pull-to-refresh, no double-tap zoom */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060a;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
      }
      :root {
        /* v6.2: readable from JS so the notch never covers touch controls */
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
